name: Publish Yokai Bathhouse
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node verify.cjs
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the game under a Pages-style URL
        env:
          BATHHOUSE_BROWSER: chromium
          BATHHOUSE_URL: http://127.0.0.1:8766/yokai-bathhouse/
        run: |
          mkdir -p preview/yokai-bathhouse
          cp dist/* preview/yokai-bathhouse/
          python3 -m http.server 8766 --bind 127.0.0.1 --directory preview &
          server=$!
          trap 'kill "$server"' EXIT
          curl --fail --retry 8 --retry-connrefused --silent "$BATHHOUSE_URL" > /dev/null
          npm run test:browser
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
